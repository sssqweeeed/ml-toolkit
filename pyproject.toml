[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-toolkit"
version = "0.4.1"
description = "Reusable ML training, metrics, PSI, diagnostics, plots, and MLflow logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "polars>=1.0", "pyarrow>=15",
    "matplotlib>=3.7", "scikit-learn>=1.4", "catboost>=1.2.10", "numba>=0.61",
    "mlflow>=3.0", "optuna>=3.0",
]

[project.optional-dependencies]
shap = ["shap>=0.46"]
lightgbm = ["lightgbm>=4.0"]
cuda = ["numba-cuda[cu12]>=0.19"]
all = ["shap>=0.46", "lightgbm>=4.0"]
test = ["pytest>=8", "pytest-xdist>=3.6", "pytest-cov>=6", "pyright>=1.1", "pandas-stubs>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
markers = [
    "gpu: requires a real CUDA device and compatible toolkit",
    "documentation: executes documentation recipes or checks their source datasets",
]

[tool.coverage.run]
source = ["ml_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pyright]
include = ["src/ml_toolkit"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
