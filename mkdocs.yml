site_name: ml-toolkit
strict: true
site_description: Training, validation, metrics, diagnostics, and MLflow for Python ML projects.
site_url: https://sssqweeeed.github.io/ml-toolkit/
repo_url: https://github.com/sssqweeeed/ml-toolkit
repo_name: sssqweeeed/ml-toolkit
edit_uri: !ENV [DOCS_EDIT_URI, edit/dev/docs/]

extra:
  version:
    provider: mike
    default: stable
    alias: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Task recipes: configuration.md
  - Data: api/data.md
  - Training:
      - Workflow and results: api/training.md
      - Data splitting: api/splitting.md
      - Feature selection: api/feature-selection.md
      - Parameter tuning: api/tuning.md
  - Models:
      - Built-in adapters: api/models.md
      - Build a model adapter: api/custom-model.md
      - Inflation: api/inflation.md
  - Evaluation:
      - Overview: evaluation/index.md
      - Model shrink curves: evaluation/model.md
      - Classification: evaluation/classification.md
      - Observed versus fitted: evaluation/observed-fitted.md
      - Ranking: evaluation/ranking.md
      - Positive-unlabeled: evaluation/pu.md
      - Feature importance and SHAP: evaluation/explainability.md
      - Build an evaluator: evaluation/custom.md
  - Data analysis:
      - Overview: data-analysis/index.md
      - Numerical distributions: data-analysis/distributions.md
      - PSI and feature levels: api/psi.md
      - Build a data analyzer: data-analysis/custom.md
  - Metrics: api/metrics.md
  - Tracking: api/tracking.md
  - Configuration: api/configuration.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 4
            show_root_toc_entry: false
            show_symbol_type_toc: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters:
              - '!^_'
              - '!^load_context$'

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - toc:
      permalink: true
      toc_depth: 3

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

not_in_nav: |
  /evaluation/distributions.md
