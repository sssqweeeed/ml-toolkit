name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: plan
        run: python .github/scripts/workflow_checks.py

  tests:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test,all]'
      - run: python -m pyright
      - name: Run all package tests
        run: python -m pytest tests -n 2 --dist loadscope --ignore=tests/documentation

  documentation:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-examples.txt
            pyproject.toml
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - name: Install recipe dependencies
        run: python -m pip install -e '.[test,all]' -r requirements-examples.txt
      - uses: actions/cache@v4
        with:
          path: |
            .cache/uci-bike-sharing
            .cache/uci-online-retail
            .cache/linqs-cora
          key: documentation-data-v1-${{ hashFiles('examples/gallery_data.py', 'examples/retail_data.py', 'examples/citation_data.py') }}
          restore-keys: documentation-data-v1-
      - name: Prepare original example datasets
        run: python -m examples.prepare_data
      # This suite renders all documented outputs and figures itself.
      - name: Verify documentation recipes and figures
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/documentation -n 2 --dist loadscope

  distribution:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python .github/scripts/check_distribution.py

  validation:
    name: Validation
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, tests, documentation, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
          DOCS: ${{ needs.documentation.result }}
          DIST: ${{ needs.distribution.result }}
        run: |
          test "$PLAN" = success
          test "$TESTS" = success
          test "$DOCS" = success
          test "$DIST" = success
      - uses: actions/checkout@v6
      - name: Record validated release candidate
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          pathlib.Path('candidate.json').write_text(json.dumps({'tree': tree, 'revision': os.environ['REVISION'], 'base': 'main'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate.json
          retention-days: 90
