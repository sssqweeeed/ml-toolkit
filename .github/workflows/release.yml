name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify successful PR validation and release tree
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_release.py verify
      - run: python -m pip install build twine
      - name: Build distributions from the release commit
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build
          python -m twine check dist/*
      - name: Publish immutable version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/publish_release.py publish

  documentation:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      source: ${{ github.sha }}
