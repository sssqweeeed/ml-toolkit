name: Retire development documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-publishing
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove the development version and preserve stable links
        id: site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, '.github/scripts')
          from publish_docs import add_legacy_redirects

          site = Path('published')
          versions = json.loads((site / 'versions.json').read_text())
          stable, = [item['version'] for item in versions if 'stable' in item['aliases']]
          if not (site / stable / 'index.html').is_file():
              raise ValueError('Stable documentation is missing')
          shutil.rmtree(site / 'dev', ignore_errors=True)
          (site / 'versions.json').write_text(json.dumps(
              [item for item in versions if item['version'] != 'dev'], indent=2
          ) + '\n')
          add_legacy_redirects(site, stable)
          PY
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add .
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'docs: retire unstable documentation'
            git -C published push origin HEAD:gh-pages
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the publicly served documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python .github/scripts/check_site.py "$PAGE_URL" published
