name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/ml_toolkit/**'
      - 'examples/**'
      - 'tests/documentation/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-examples.txt'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/ml_toolkit/**'
      - 'examples/**'
      - 'tests/documentation/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-examples.txt'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-examples.txt
            pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install -e '.[test,all]' -r requirements-docs.txt -r requirements-examples.txt
      - name: Cache original example datasets
        uses: actions/cache@v4
        with:
          path: |
            .cache/uci-bike-sharing
            .cache/uci-online-retail
            .cache/linqs-cora
          key: documentation-data-v1-${{ hashFiles('examples/gallery_data.py', 'examples/retail_data.py', 'examples/citation_data.py') }}
          restore-keys: documentation-data-v1-
      - name: Prepare original example datasets
        run: python -m examples.prepare_data
      - name: Verify example output and figures
        env:
          MPLBACKEND: Agg
        run: python -m examples.render_examples --check
      - name: Check documented behavior and source examples
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/documentation -n 2 --dist loadscope
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
